<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PhotoOnTv</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div id="fil"></div>
  <div id="droite">
    <div id="compteurs"></div>
    <div id="actions">
      <div class="bouton" id="b-ordre" data-action="ordre"><span class="icone"></span><span class="libelle">Ordre</span></div>
      <div class="bouton" id="b-diaporama" data-action="diaporama"><span class="icone"></span><span class="libelle">Diaporama</span></div>
      <div class="bouton" id="b-aleatoire" data-action="aleatoire"><span class="icone"></span><span class="libelle">Aléatoire</span></div>
    </div>
  </div>
</header>

<main id="vue">
  <div id="plan"></div>
  <div id="vide">Dossier vide</div>
</main>

<!-- Visionneuse plein écran (photos et aperçu des vidéos) -->
<div id="visio">
  <img id="v-image" alt="">
  <div id="v-absent">Aperçu indisponible</div>
  <div id="v-lecture"></div>
  <div id="v-info"><span id="v-nom"></span><span id="v-position"></span></div>
</div>

<!-- Lecteur vidéo : AVPlay sur la télé, <video> ailleurs -->
<div id="lecteur">
  <object id="av-player" type="application/avplayer"></object>
  <video id="video-html"></video>
  <div id="l-barre">
    <div id="l-nom"></div>
    <div id="l-progression"><div id="l-avance"></div></div>
    <div id="l-temps"></div>
  </div>
</div>

<!-- Diaporama : deux calques pour le fondu ; seule surimpression, l'indication de pause / délai (5 s) -->
<div id="diapo">
  <img id="d-a" alt="">
  <img id="d-b" alt="">
  <div id="d-info"><span class="icone"></span><span class="texte"></span></div>
</div>

<div id="chargement"></div>
<div id="message"></div>

<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/grille.js"></script>
<script src="js/video.js"></script>
<script src="js/visionneuse.js"></script>
<script src="js/diaporama.js"></script>
<script src="js/app.js"></script>
</body>
</html>
